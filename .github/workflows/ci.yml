# Lint and test on every push and pull request. Tests use the saved pages in
# tests/fixtures/; nothing is fetched from the providers here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the dev tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --quiet "pytest==9.0.3" "ruff==0.15.13"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Test
        run: .venv/bin/python -m pytest -q

      - name: Validate the ledger and the model map
        run: |
          .venv/bin/python - <<'PY'
          import json
          import price_ledger

          ledger = price_ledger.load_bundled()
          price_ledger.validate_model_map(json.loads(price_ledger.MODEL_MAP_PATH.read_text(encoding="utf-8")))
          print(f"prices.json: {len(ledger.entries)} prices, generated {ledger.generated_at}")
          PY
