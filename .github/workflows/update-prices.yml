# Keeps prices.json current from the providers' public price lists.
#
# Daily (and on demand) it runs update_price_ledger.py. When the ledger
# changed it opens or updates ONE pull request on a fixed branch, with the
# updater's Markdown report as the body. When a source failed (exit 2) or a
# price moved more than x2 / /2 (exit 3) it opens or updates ONE issue with
# the report instead of failing silently. Auto-merge is off unless the
# repository variable PRICE_LEDGER_AUTO_MERGE is 'true', and even then only
# for runs with nothing flagged. See README.md.
name: Update price ledger

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-price-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: automation/price-ledger
      BASE: ${{ github.event.repository.default_branch }}
      ISSUE_TITLE: Price ledger update needs attention
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run the updater
        id: run
        run: |
          set +e
          python3 update_price_ledger.py --report "$RUNNER_TEMP/report.md"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # 0 ok, 2 source failed, 3 needs review are handled below; anything else is a crash.
          case "$code" in
            0|2|3) ;;
            *) echo "::error::update_price_ledger.py exited with $code"; exit "$code" ;;
          esac
          # GitHub caps PR/issue bodies at 65536 characters.
          head -c 60000 "$RUNNER_TEMP/report.md" > "$RUNNER_TEMP/body.md"

      - name: Open or update the pull request
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add prices.json
          git commit -m "Update prices.json"
          git push --force origin "$BRANCH"
          pr="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --base "$BASE" --title "Update prices.json" \
              --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Enable auto-merge (opt-in, clean runs only)
        if: >-
          steps.run.outputs.changed == 'true' && steps.run.outputs.code == '0' &&
          vars.PRICE_LEDGER_AUTO_MERGE == 'true'
        run: gh pr merge "$BRANCH" --auto --squash

      - name: Open or update the issue
        if: steps.run.outputs.code == '2' || steps.run.outputs.code == '3'
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: |
          if [ "$CODE" = "2" ]; then
            reason="A price source could not be fetched or parsed; its previous prices were kept."
          else
            reason="A price moved by more than x2 or /2. Check it before merging the price-ledger pull request."
          fi
          { echo "$reason"; echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; \
            cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/issue.md"
          issue="$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")"
          if [ -z "$issue" ]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/issue.md"
            gh issue comment "$issue" --body "Updated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
